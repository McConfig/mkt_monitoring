global:
  scrape_interval: 45s
  scrape_timeout: 30s
  evaluation_interval: 15s
  external_labels:
    origin_prometheus: mktxp

alerting:
  alertmanagers:
  - static_configs:
    - targets:

rule_files:

scrape_configs:

  - job_name: raspberry_pi_node
    static_configs:
    - targets: [10.0.0.9:9100]

  - job_name: hermes_server_node
    static_configs:
    - targets: [10.75.66.1:9100]

  - job_name: prometheus
    static_configs:
    - targets: [prometheus:9090]

  - job_name: grafana
    static_configs:
    - targets: [grafana:3000]

  - job_name: loki
    static_configs:
    - targets: [loki:3100]

  - job_name: promtail
    static_configs:
    - targets: [promtail:9080]

  - job_name: mktxp
    static_configs:
      - targets: [mktxp:49090]

  - job_name: blackbox
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [icmp_ttl5]
    static_configs:
      - targets:
        - 1.1.1.1
        - 8.8.8.8
        - 77.88.8.8
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox_https
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://www.youtube.com/
        - https://telegram.org/
        - https://x.com/
        - https://discord.com/
        - https://www.instagram.com/
        - https://www.google.com/
        - https://www.facebook.com/
        - https://rutracker.org/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
